name: On Prs

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    if: contains(github.event.pull_request.labels.*.name, 'auto-approve-me')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v3

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Environment
      uses: ./.github/actions/setup-env

    - uses: blocky/actions/go-lint@main
      with:
        config: './golangci.yaml'
        timeout: '3m'

  unit-test-mac:
    # unit tests on ubuntu are already covered by on-every-commit.yml
    # macos-14 is M1 (i.e., ARM)
    runs-on: macos-14
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Unit Tests
        run: make test-short

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Environment
      uses: ./.github/actions/setup-env

    - name: Setup docker buildx
      shell: bash
      run: |
        make container-setup

    - name: Run Integration Tests
      run: make test-integration-dind

  compatibility-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Setup docker buildx
        shell: bash
        run: |
          make container-setup

      - name: Run Compatibility Tests
        env:
          BKY_COMPILER_GH_TOKEN: ${{ secrets.GH_ACTIONS_GH_PUBLIC_API_ACCESS_NO_SCOPES }}
        run: make test-compatibility-dind
